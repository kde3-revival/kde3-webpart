<!doctype html>
<!-- Images scaled down by the page: tests/imagescale/run.sh crops them out of
     a screenshot (content origin at the top left) and compares them with a
     Lanczos-3 reference.  zone.png comes from tests/imagescale/zoneplate.py,
     hero.png is any 1920x1152 screenshot. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: #fff; }
img { position: absolute; display: block; }
.bg { position: absolute; left: 720px; top: 300px; width: 400px; height: 240px;
      background: url(hero.png) 0 0 / 400px 240px no-repeat; }
</style></head><body>
<img src="zone.png" style="left:0;top:0;width:280px;height:280px">
<img src="hero.png" style="left:300px;top:0;width:400px;height:240px">
<img src="hero.png" style="left:0;top:300px;width:640px;height:384px">
<div class="bg"></div>
<img src="hero.png" style="left:720px;top:0;width:1280px;height:768px;transform:scale(0.3125);transform-origin:0 0">
</body></html>
