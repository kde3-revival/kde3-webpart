<!DOCTYPE html>
<html><head><title>paste</title>
<style>
  input, textarea, #rich { display: block; width: 500px; margin: 8px 0; font-size: 16px; }
  textarea { height: 60px; }
  #rich { min-height: 60px; border: 1px solid #888; }
  #log { font: 13px monospace; white-space: pre; }
</style></head>
<body>
<h3>Paste tests</h3>
<input id="field" placeholder="Ctrl+V / Shift+Insert / middle click here">
<textarea id="area"></textarea>
<div id="rich" contenteditable="true"></div>
<button id="copy">copy the field (execCommand)</button>
<button id="read">navigator.clipboard.readText()</button>
<div id="log"></div>
<script>
function log(s) {
  document.getElementById('log').textContent += s + '\n';
  new Image().src = '/report?host=' + location.host + '&name=paste&expected=&result=' + encodeURIComponent(s);
}
// A page must not read the clipboard by itself.
try { log('execCommand(paste) at load: ' + document.execCommand('paste')); } catch (e) { log('execCommand(paste) threw ' + e); }
if (navigator.clipboard && navigator.clipboard.readText)
  navigator.clipboard.readText().then(function (t) { log('readText at load: GOT [' + t + ']'); },
                                       function (e) { log('readText at load refused: ' + e.name); });
setTimeout(function () {
  try { log('execCommand(paste) later: ' + document.execCommand('paste')); } catch (e) { log('threw ' + e); }
}, 1500);
document.addEventListener('paste', function (e) {
  var dt = e.clipboardData;
  log('paste event types=[' + Array.prototype.join.call(dt.types, ',') + '] text=[' + dt.getData('text/plain') + ']');
});
document.getElementById('copy').onclick = function () {
  var f = document.getElementById('field'); f.select();
  log('execCommand(copy): ' + document.execCommand('copy'));
};
document.getElementById('read').onclick = function () {
  navigator.clipboard.readText().then(function (t) { log('readText on click: GOT [' + t + ']'); },
                                       function (e) { log('readText on click refused: ' + e.name); });
};
['field', 'area', 'rich'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', function () {
    var el = document.getElementById(id);
    log(id + ' = [' + (el.value !== undefined ? el.value : el.innerHTML) + ']');
  });
});
</script>
</body></html>
