<!DOCTYPE html>
<html><head><title>dialogs</title>
<style> button { display: block; margin: 8px 0; font-size: 16px; } #log { font: 13px monospace; white-space: pre; } </style>
</head><body>
<h3>Script dialogs</h3>
<button id="a" onclick="log('alert returned ' + alert('Hello <b>not bold</b>\nsecond line'))">alert</button>
<button id="c" onclick="log('confirm: ' + confirm('Proceed?'))">confirm</button>
<button id="p" onclick="log('prompt: ' + JSON.stringify(prompt('Your name?', 'default')))">prompt</button>
<button id="loop" onclick="for (var i = 0; i < 5; i++) alert('loop ' + i); log('loop done')">5 alerts</button>
<button id="later" onclick="setTimeout(function () { log('timer alert returned'); alert('from a timer'); log('timer alert closed'); }, 3000)">alert in 3 s</button>
<button id="bu" onclick="window.onbeforeunload = function (e) { e.preventDefault(); return 'x'; }; log('beforeunload armed')">arm beforeunload</button>
<a href="/index.html">a link to leave</a>
<div id="log"></div>
<script>
function log(s) {
  document.getElementById('log').textContent += s + '\n';
  new Image().src = '/report?host=' + location.host + '&name=dialogs&expected=&result=' + encodeURIComponent(s);
}
</script>
</body></html>
